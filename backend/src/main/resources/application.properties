# ===================================================================
# Smart Krishi – Precision Agriculture Platform
# Application Configuration
# ===================================================================

# Server Port (configurable via Render/Cloud PORT env var)
server.port=${PORT:8080}

spring.application.name=smart-krishi-backend

# Database Configuration via Environment Variables
# Defaults to in-memory H2 with MySQL mode for zero-setup local dev/testing
# In cloud deployment (Render), configure SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartkrishidb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (local dev inspection at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload Configuration (supports leaf images up to 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret via Environment Variable (JWT_SECRET)
smartkrishi.jwt.secret=${JWT_SECRET:}
smartkrishi.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Weather API (Open-Meteo free API requires no key; optional key for other providers)
smartkrishi.weather.api-key=${WEATHER_API_KEY:}

# Government Mandi Prices API (data.gov.in / AGMARKNET)
smartkrishi.mandi.api-url=${MANDI_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
smartkrishi.mandi.api-key=${MANDI_API_KEY:}
smartkrishi.mandi.cache-duration-minutes=${MANDI_CACHE_MINUTES:15}

# CORS Configuration via Environment Variable (CORS_ALLOWED_ORIGINS)
# Supports Netlify domains (*.netlify.app), localhost, or comma-separated origins
smartkrishi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,https://*.netlify.app,https://smart-krishi.netlify.app,*}

# Logging
logging.level.com.smartkrishi=INFO
logging.level.org.springframework.security=INFO
