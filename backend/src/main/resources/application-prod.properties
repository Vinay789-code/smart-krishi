# ===================================================================
# Smart Krishi – Precision Agriculture Platform
# Production Profile (Cloud MySQL on Render)
# ===================================================================

server.port=${PORT:8080}

# Cloud MySQL Datasource via Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Production CORS for Netlify
smartkrishi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.netlify.app,https://smart-krishi.netlify.app}

# Government Mandi Prices API (data.gov.in / AGMARKNET)
smartkrishi.mandi.api-url=${MANDI_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
smartkrishi.mandi.api-key=${MANDI_API_KEY:}
smartkrishi.mandi.cache-duration-minutes=${MANDI_CACHE_MINUTES:15}
