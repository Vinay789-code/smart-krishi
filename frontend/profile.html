<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Profile & Land Records | Smart Krishi – Precision Agriculture Platform</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <main class="py-4">
    <div class="container">
      <!-- Profile Header -->
      <div class="bg-white p-4 rounded-3 border shadow-sm mb-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
          <div class="d-flex align-items-center gap-3">
            <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.75rem;">
              <i class="bi bi-person-fill"></i>
            </div>
            <div>
              <div class="d-flex align-items-center gap-2">
                <h3 class="fw-bold mb-0 text-dark" id="profile-name-header">Farmer Name</h3>
                <span class="badge bg-success-subtle text-success" id="profile-role-badge">Farmer</span>
              </div>
              <div class="text-muted small mt-1">
                <span class="me-3"><i class="bi bi-envelope me-1"></i><span id="profile-email-header">email</span></span>
                <span><i class="bi bi-telephone me-1"></i><span id="profile-phone-header">phone</span></span>
              </div>
            </div>
          </div>
          <div class="mt-3 mt-md-0">
            <button class="btn btn-agro-primary" data-bs-toggle="modal" data-bs-target="#addFarmModal">
              <i class="bi bi-plus-circle me-1"></i>Add Farm / Plot
            </button>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <!-- Edit Profile Form -->
        <div class="col-lg-5">
          <div class="agro-card p-4">
            <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">
              <i class="bi bi-pencil-square me-2 text-success"></i>Edit Profile Details
            </h5>

            <form id="profile-edit-form">
              <div class="mb-3">
                <label for="input-name" class="form-label">Full Name</label>
                <input type="text" id="input-name" class="form-control" required>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="input-email" class="form-label">Email (Account ID)</label>
                  <input type="email" id="input-email" class="form-control bg-light" readonly>
                </div>
                <div class="col-md-6">
                  <label for="input-phone" class="form-label">Phone Number</label>
                  <input type="tel" id="input-phone" class="form-control" required>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-4">
                  <label for="input-village" class="form-label">Village</label>
                  <input type="text" id="input-village" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="input-district" class="form-label">District</label>
                  <input type="text" id="input-district" class="form-control">
                </div>
                <div class="col-md-4">
                  <label for="input-state" class="form-label">State</label>
                  <input type="text" id="input-state" class="form-control">
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="input-landArea" class="form-label">Land Area (Acres)</label>
                  <input type="number" step="0.1" id="input-landArea" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label for="input-soilType" class="form-label">Soil Type</label>
                  <select id="input-soilType" class="form-select">
                    <option value="Alluvial">Alluvial Soil</option>
                    <option value="Black Soil">Black Cotton Soil</option>
                    <option value="Red Soil">Red Soil</option>
                    <option value="Sandy Loam">Sandy Loam</option>
                    <option value="Clay Loam">Clay Loam</option>
                    <option value="Laterite">Laterite Soil</option>
                  </select>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="input-irrigationType" class="form-label">Irrigation Method</label>
                  <select id="input-irrigationType" class="form-select">
                    <option value="Drip Irrigation">Drip Irrigation</option>
                    <option value="Sprinkler">Sprinkler</option>
                    <option value="Tube Well">Tube Well / Borewell</option>
                    <option value="Canal Irrigation">Canal Irrigation</option>
                    <option value="Rainfed">Rainfed</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="input-primaryCrop" class="form-label">Primary Crop</label>
                  <input type="text" id="input-primaryCrop" class="form-control" placeholder="e.g. Soybean, Wheat">
                </div>
              </div>

              <button type="submit" id="btn-save-profile" class="btn btn-agro-primary w-100 py-2">
                <i class="bi bi-check2-circle me-1"></i>Save Changes
              </button>
            </form>
          </div>
        </div>

        <!-- Land & Farm Plots Table -->
        <div class="col-lg-7">
          <div class="agro-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
              <div>
                <h5 class="fw-bold text-dark mb-0"><i class="bi bi-grid-1x2-fill me-2 text-success"></i>Registered Farm Plots</h5>
                <small class="text-muted">Land parcels registered under this farmer profile</small>
              </div>
              <button class="btn btn-sm btn-agro-outline" data-bs-toggle="modal" data-bs-target="#addFarmModal">
                <i class="bi bi-plus me-1"></i>Add Plot
              </button>
            </div>

            <div class="table-responsive">
              <table class="table table-hover table-agro align-middle mb-0">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Plot Name</th>
                    <th>Survey / Plot #</th>
                    <th>Area</th>
                    <th>Soil</th>
                    <th>Source</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="farms-table-body">
                  <tr>
                    <td colspan="7" class="text-center py-4 text-muted">
                      <span class="loading-spinner"></span>
                      <p class="small mt-2 mb-0">Loading farm plots...</p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Add Farm Modal -->
  <div class="modal fade" id="addFarmModal" tabindex="-1" aria-labelledby="addFarmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="add-farm-form">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="addFarmModalLabel"><i class="bi bi-plus-circle me-2 text-success"></i>Record New Farm Plot</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Farm / Plot Name *</label>
              <input type="text" id="farm-name-input" class="form-control" placeholder="e.g. North Canal Plot" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Survey / Gat Number</label>
                <input type="text" id="farm-plot-input" class="form-control" placeholder="e.g. 104/A">
              </div>
              <div class="col-6">
                <label class="form-label">Area (Acres) *</label>
                <input type="number" step="0.1" min="0.1" id="farm-area-input" class="form-control" placeholder="e.g. 2.5" required>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Soil Type</label>
                <select id="farm-soil-input" class="form-select">
                  <option value="Black Soil">Black Cotton Soil</option>
                  <option value="Alluvial">Alluvial Soil</option>
                  <option value="Red Soil">Red Soil</option>
                  <option value="Sandy Loam">Sandy Loam</option>
                  <option value="Clay Loam">Clay Loam</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label">Water Source</label>
                <input type="text" id="farm-water-input" class="form-control" placeholder="e.g. Borewell + Drip">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-agro-primary">Save Farm Plot</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
