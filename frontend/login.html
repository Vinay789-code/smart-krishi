<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Krishi – Precision Agriculture Platform</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-container"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="agro-card p-4 p-md-5">
            <div class="text-center mb-4">
              <span class="brand-icon mx-auto mb-2"><i class="bi bi-flower1"></i></span>
              <h3 class="fw-bold text-dark">Welcome to Smart Krishi</h3>
              <p class="text-muted small">Sign in to your farmer account or administration console</p>
            </div>

            <form id="login-form">
              <div class="mb-3">
                <label for="login-email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="login-password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" id="login-password" class="form-control" placeholder="Enter password" required>
                </div>
              </div>

              <button type="submit" id="btn-login-submit" class="btn btn-agro-primary w-100 py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
              </button>
            </form>

            <div class="text-center small text-muted">
              Don't have an account yet? <a href="register.html" class="text-success fw-bold">Register as Farmer</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar('login');
      UI.renderFooter();

      // Check query params
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('loggedOut')) {
        UI.showToast('You have been signed out successfully', 'info');
      } else if (urlParams.get('expired')) {
        UI.showToast('Your session has expired. Please sign in again.', 'warning');
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-login-submit');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          const user = await AUTH.login(email, password);
          UI.showToast(`Welcome back, ${user.name}!`, 'success');
          setTimeout(() => {
            if (user.role === 'ROLE_ADMIN') {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'dashboard.html';
            }
          }, 600);
        } catch (err) {
          console.error('Login error:', err);
          UI.showToast(err.message || 'Invalid email or password', 'error');
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i>Sign In`;
        }
      });
    });
  </script>
</body>
</html>
